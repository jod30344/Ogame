<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星際採礦站 · 多人版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0b1220; --bg-panel: #121b2e; --bg-panel-hover: #17233b;
    --line: #253352; --text-main: #e7ecf5; --text-dim: #8a96b3;
    --metal: #6fb3ff; --crystal: #f0a850; --defense: #a855f7;
    --ok: #4fd1a5; --warn: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 32px 20px 60px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-family: 'Space Mono', monospace; font-size: 28px; margin: 6px 0 2px; }
  .sub { color: var(--text-dim); font-size: 14px; }
  .section-label { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .resources { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 24px 0 30px; }
  .res-card { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .res-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
  .res-value { font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700; }
  .building { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  button.upgrade { background: #1a2440; border: 1px solid var(--line); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  button.upgrade:disabled { opacity: 0.3; cursor: not-allowed; }
  .galaxy-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 30px; }
  .planet-thumb { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
  .planet-thumb:hover { border-color: var(--ok); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login-screen" class="wrap" style="max-width: 400px; margin-top: 100px; text-align: center;">
  <h1>星際採礦站</h1>
  <input type="text" id="player-input" placeholder="輸入玩家代號" style="width:100%; padding:10px; border-radius:6px; margin-bottom:10px;">
  <button id="login-btn" style="width:100%; padding:10px; background:var(--ok); border:none; border-radius:6px; font-weight:bold;">進入星球</button>
</div>

<div id="game-screen" class="wrap hidden">
  <header>
    <div><h1 id="planet-title">殖民地</h1></div>
    <button id="signout-btn" style="background:none; border:1px solid #333; color:#888; padding:5px 10px; cursor:pointer;">登出</button>
  </header>

  <div class="resources">
    <div class="res-card"><div class="res-label">金屬</div><div class="res-value" id="metal-value">0</div></div>
    <div class="res-card"><div class="res-label">晶體</div><div class="res-value" id="crystal-value">0</div></div>
  </div>

  <div class="section-label">銀河星系看板</div>
  <div class="galaxy-map" id="galaxy-map"></div>

  <div class="section-label">建築</div>
  <div id="buildings"></div>

  <div class="section-label">攻擊</div>
  <div style="background:var(--bg-panel); padding:15px; border-radius:10px;">
    <input type="text" id="target-name" placeholder="對方代號" style="background:#0b1220; border:1px solid #253352; color:white; padding:8px;">
    <input type="number" id="attack-count" value="1" style="background:#0b1220; width:60px; border:1px solid #253352; color:white; padding:8px;">
    <button id="attack-btn" style="background:var(--warn); color:white; border:none; padding:8px 15px; cursor:pointer;">發動攻擊</button>
    <div id="attack-msg" style="margin-top:10px; font-size:13px;"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://mmbmokpsgqvtvmusqlhe.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_GC4Qkmgxpv2lAGZUJkW6gQ_0PmqUOGv';

  async function restRequest(path, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation', ...(options.headers || {}) }
    });
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  const BUILDING_DEFS = {
    metalMine: { name: '金屬礦場', resource: 'metal', baseRate: 6, baseCost: { metal: 60, crystal: 15 }, levelField: 'metal_mine_level' },
    crystalMine: { name: '晶體精煉廠', resource: 'crystal', baseRate: 4, baseCost: { metal: 48, crystal: 24 }, levelField: 'crystal_mine_level' },
    laserTower: { name: '雷射砲台', resource: 'defense', baseRate: 0, baseCost: { metal: 100, crystal: 50 }, levelField: 'laser_tower_level' }
  };

  let planet = null, localMetal = 0, localCrystal = 0;

  function fmt(n) { return Math.floor(n).toLocaleString('zh-TW'); }

  async function login() {
    const name = document.getElementById('player-input').value.trim();
    if (!name) return;
    let rows = await restRequest(`planets?player_name=eq.${encodeURIComponent(name)}&select=*`);
    if (rows && rows.length > 0) { planet = rows[0]; }
    else { planet = (await restRequest('planets', { method: 'POST', body: JSON.stringify({ player_name: name, laser_tower_level: 0 }) }))[0]; }
    
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    document.getElementById('planet-title').textContent = planet.player_name + ' 的殖民地';
    localMetal = Number(planet.metal); localCrystal = Number(planet.crystal);
    render();
    loadGalaxyMap();
    setInterval(render, 1000);
  }

  async function loadGalaxyMap() {
    const players = await restRequest('planets?select=player_name,fighter_count');
    const container = document.getElementById('galaxy-map');
    container.innerHTML = players.map(p => `
      <div class="planet-thumb" onclick="document.getElementById('target-name').value='${p.player_name}'">
        <div style="font-size:20px;">🪐</div>
        <span style="font-size:12px;">${p.player_name}</span>
      </div>
    `).join('');
  }

  function render() {
    document.getElementById('metal-value').textContent = fmt(localMetal);
    document.getElementById('crystal-value').textContent = fmt(localCrystal);
    
    const container = document.getElementById('buildings');
    container.innerHTML = '';
    Object.entries(BUILDING_DEFS).forEach(([key, def]) => {
      const level = planet[def.levelField] || 0;
      const el = document.createElement('div');
      el.className = 'building';
      el.innerHTML = `<div>${def.name} (LV ${level})</div> <button class="upgrade" onclick="upgrade('${key}')">升級</button>`;
      container.appendChild(el);
    });
  }

  async function upgrade(key) {
    const def = BUILDING_DEFS[key];
    planet[def.levelField] += 1;
    await restRequest(`planets?id=eq.${planet.id}`, { method: 'PATCH', body: JSON.stringify({ [def.levelField]: planet[def.levelField] }) });
    render();
  }

  document.getElementById('login-btn').addEventListener('click', login);
  
  document.getElementById('attack-btn').addEventListener('click', async () => {
    const targetName = document.getElementById('target-name').value;
    const target = (await restRequest(`planets?player_name=eq.${encodeURIComponent(targetName)}&select=*`))[0];
    const shipsSent = parseInt(document.getElementById('attack-count').value);
    
    // 計算防禦力：艦隊數 + (塔等級 * 10)
    const defenderPower = target.fighter_count + ((target.laser_tower_level || 0) * 10);
    
    if (shipsSent > defenderPower) {
        document.getElementById('attack-msg').textContent = '攻擊成功！';
    } else {
        document.getElementById('attack-msg').textContent = '攻擊失敗，對方防禦過高！';
    }
  });

  document.getElementById('signout-btn').onclick = () => location.reload();
</script>
</body>
</html>
